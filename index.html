<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashish Gaurav | Senior Data Engineer Portfolio</title>
    <meta
      name="description"
      content="Ashish Gaurav is a Senior Data Engineer building healthcare data platforms with Databricks, Snowflake, PySpark, and Airflow. Explore measurable delivery impact and experience."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Ashish Gaurav | Senior Data Engineer Portfolio" />
    <meta
      property="og:description"
      content="Senior Data Engineer building reliable healthcare data platforms with Databricks, Snowflake, PySpark, and Airflow."
    />
    <meta property="og:image" content="./images/ashish-resume-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ashish Gaurav | Senior Data Engineer Portfolio" />
    <meta
      name="twitter:description"
      content="Explore Ashish Gaurav's experience, technical strengths, and measurable results in healthcare data engineering."
    />
    <meta name="twitter:image" content="./images/ashish-resume-preview.png" />
  </head>
  <body>
    <div id="root">
      <main class="portfolio-home">
        <section class="recruiter-section how-section dataflow-section" aria-label="How data engineering works">
          <div class="section-inner">
            <div class="section-heading">
              <p>HOW DATA ENGINEERING WORKS</p>
              <h2>From scattered information to trusted answers</h2>
            </div>
            <div class="dataflow-scene dataflow-static-fallback">
              <div class="dataflow-track" aria-hidden="true">
                <div class="dataflow-track-line"></div>
                <span class="dataflow-waypoint waypoint-1"></span>
                <span class="dataflow-waypoint waypoint-2"></span>
                <span class="dataflow-waypoint waypoint-3"></span>
                <span class="dataflow-waypoint waypoint-4"></span>
              </div>
              <div class="dataflow-stages">
              <article class="dataflow-stage">
                <div class="dataflow-stage-title"><span class="dataflow-stage-icon" aria-hidden="true">↓</span><h3>Collect</h3></div>
                <p>Gathering data from multiple sources</p>
              </article>
              <article class="dataflow-stage">
                <div class="dataflow-stage-title"><span class="dataflow-stage-icon" aria-hidden="true">≡</span><h3>Organize</h3></div>
                <p>Cleaning and structuring data</p>
              </article>
              <article class="dataflow-stage">
                <div class="dataflow-stage-title"><span class="dataflow-stage-icon" aria-hidden="true">✓</span><h3>Validate</h3></div>
                <p>Catching errors automatically</p>
              </article>
              <article class="dataflow-stage">
                <div class="dataflow-stage-title"><span class="dataflow-stage-icon" aria-hidden="true">→</span><h3>Deliver</h3></div>
                <p>Trusted data ready to use</p>
              </article>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
